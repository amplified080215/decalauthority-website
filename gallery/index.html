<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Execution Gallery | Decal Authority</title>
    <meta name="description" content="View our documented deployment proof, including the O!Save 13-vehicle rollout and our grand execution archive.">
    <link rel="preload" href="/assets/css/style.css" as="style">
    <link rel="stylesheet" href="/assets/css/style.css">
    <style>
        /* Base styling for the grand gallery - large box sizes restored */
        .gallery-item {
            background-color: var(--color-border); 
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 450px;
        }
        .gallery-item img {
            width: 100%;
            height: 320px;
            object-fit: cover;
        }
        
        /* SLOW DOWN MARQUEE */
        .gallery-marquee-track {
            animation-duration: 90s !important; /* Much slower and easier to read */
        }
        #json-gallery-row2 {
            animation-duration: 100s !important; /* Slightly offset speed for depth */
        }

        /* Slideshow image class for O!Save */
        .osave-slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 4px;
            transition: opacity 1s ease-in-out;
        }

        /* --- RESPONSIVE CLASSES FOR O!SAVE SECTION --- */
        .case-study-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            align-items: stretch;
            gap: 60px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }
        
        /* Mobile Adjustments */
        @media (max-width: 768px) {
            .case-study-grid {
                grid-template-columns: 1fr; /* Stacks image on top, text on bottom */
                gap: 30px;
            }
            .case-study-section {
                padding: 40px 5% !important; /* Reduces massive top padding on phones */
            }
            #osave-slider-container {
                min-height: 250px !important; /* Keeps the slider proportioned on small screens */
            }
            .stats-grid {
                grid-template-columns: 1fr; /* Stacks the 13, 48, 3-4 stats vertically for readability */
            }
            
            /* --- MOBILE FIX FOR GRAND GALLERY MARQUEE --- */
            /* Removed the shrinking CSS here so images return to their large, clear 450px box size */
            .grand-gallery-section {
                padding: 50px 0 !important; /* Reduces excessive white space above/below marquee */
            }
        }
    </style>
</head>
<body>
    
    <div id="global-nav"></div>

    <main class="content-full">
        <!-- 1. PAGE HEADER -->
        <section class="page-header-section">
            <div class="header-container">
                <span class="hero-label">VERIFIED PROOF</span>
                <h1>Documented Deployments.</h1>
                <div class="accent-line"></div>
                <p>We do not use 3D mockups to sell our services. Every vehicle, facility, and signage system below represents a physical, documented execution delivered by the Decal Authority team.</p>
            </div>
        </section>

        <!-- 2. O!SAVE FEATURED CASE STUDY (WITH AUTO-FADING SLIDER) -->
        <section class="case-study-section" style="padding: 80px 5%; background-color: var(--color-navy); color: #fff;">
            <div class="case-study-grid" id="json-case-study">
                <!-- Data loads here -->
            </div>
        </section>

        <!-- 3. GRAND GALLERY MARQUEE -->
        <section class="grand-gallery-section" style="padding: 80px 0; overflow: hidden; background-color: var(--color-bg);">
            <div style="text-align: center; margin-bottom: 40px;">
                <span class="hero-label" id="json-gallery-label">PRODUCTION ARCHIVE</span>
                <h2 style="font-size: 2.2rem; color: var(--color-navy);" id="json-gallery-title">Execution Gallery</h2>
            </div>

            <!-- Row 1: Moves Left -->
            <div class="gallery-marquee-wrapper">
                <div class="gallery-marquee-track" id="json-gallery-row1"></div>
            </div>

            <!-- Row 2: Moves Right (Reverse) -->
            <div class="gallery-marquee-wrapper" style="margin-top: 30px;">
                <div class="gallery-marquee-track" id="json-gallery-row2" style="animation-direction: reverse; animation-duration: 45s;"></div>
            </div>
            
            <div style="text-align: center; margin-top: 50px;">
                <a href="/contacts/" class="btn btn-primary">Start Your Project</a>
            </div>
        </section>
    </main>

    <div id="global-footer"></div>
    <script src="/global.js"></script>

    <!-- JSON Fetch Script for Gallery -->
    <script>
        fetch('/data/gallery.json')
            .then(response => response.json())
            .then(data => {
                
                // 1. Build O!Save Case Study
                const caseContainer = document.getElementById('json-case-study');
                const cs = data.caseStudy;
                const osaveImages = data.osaveMarquee; 
                
                let statsHtml = '';
                cs.stats.forEach(stat => {
                    statsHtml += `
                        <div class="stat-box" style="padding: 20px; border: 1px solid rgba(255,255,255,0.1); background-color: rgba(255,255,255,0.02); text-align: center;">
                            <div class="stat-num highlight" style="font-size: 2.5rem; color: var(--color-mustard);">${stat.number}</div>
                            <div class="stat-desc" style="color: rgba(255,255,255,0.7); font-size: 0.8rem; letter-spacing: 1px; text-transform: uppercase;">${stat.desc}</div>
                        </div>
                    `;
                });

                let sliderHtml = '';
                if (osaveImages && osaveImages.length > 0) {
                    osaveImages.forEach((src, index) => {
                        sliderHtml += `<img src="${src}" alt="O!Save Fleet ${index + 1}" class="osave-slide" style="opacity: ${index === 0 ? '1' : '0'};">`;
                    });
                } else {
                    sliderHtml = `<img src="${cs.image}" alt="${cs.title}" style="position: absolute; top:0; left:0; width: 100%; height: 100%; object-fit: cover; border-radius: 4px;">`;
                }

                caseContainer.innerHTML = `
                    <div style="display: flex; flex-direction: column; justify-content: center; background-color: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; padding: 20px; position: relative; min-height: 400px; overflow: hidden;" id="osave-slider-container">
                        ${sliderHtml}
                    </div>
                    
                    <div class="case-content" style="display: flex; flex-direction: column; justify-content: center;">
                        <span class="hero-label" style="color: var(--color-mustard); margin-bottom: 15px; display: inline-block;">${cs.label}</span>
                        <h2 style="font-size: 2.5rem; margin-bottom: 15px; color: #ffffff;">${cs.title}</h2>
                        <h3 style="font-size: 1.1rem; color: rgba(255,255,255,0.9); margin-bottom: 25px; font-weight: normal;">${cs.subtext}</h3>
                        <p style="margin-bottom: 40px; color: rgba(255,255,255,0.7); line-height: 1.6;">${cs.description}</p>
                        
                        <div class="stats-grid">
                            ${statsHtml}
                        </div>
                    </div>
                `;

                // Slideshow logic
                if (osaveImages && osaveImages.length > 1) {
                    let currentSlide = 0;
                    const slides = document.getElementById('osave-slider-container').querySelectorAll('.osave-slide');
                    
                    setInterval(() => {
                        slides[currentSlide].style.opacity = '0';
                        currentSlide = (currentSlide + 1) % slides.length;
                        slides[currentSlide].style.opacity = '1';
                    }, 3500); 
                }

                // 2. Build Grand Gallery Headers
                if (data.grandGallery) {
                    document.getElementById('json-gallery-label').innerText = data.grandGallery.label;
                    document.getElementById('json-gallery-title').innerText = data.grandGallery.title;

                    // 3. Build Row 1
                    const row1Container = document.getElementById('json-gallery-row1');
                    const loopedRow1 = [...data.grandGallery.row1, ...data.grandGallery.row1];
                    loopedRow1.forEach(imgSrc => {
                        row1Container.innerHTML += `<div class="gallery-item"><img src="${imgSrc}" alt="Decal Authority Execution" loading="lazy"></div>`;
                    });

                    // 4. Build Row 2
                    const row2Container = document.getElementById('json-gallery-row2');
                    const loopedRow2 = [...data.grandGallery.row2, ...data.grandGallery.row2];
                    loopedRow2.forEach(imgSrc => {
                        row2Container.innerHTML += `<div class="gallery-item"><img src="${imgSrc}" alt="Decal Authority Execution" loading="lazy"></div>`;
                    });
                }
            })
            .catch(error => console.error('Error loading gallery data:', error));
    </script>
</body>
</html>
