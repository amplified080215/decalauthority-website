<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Decal Authority</title>
    <meta name="description" content="Talk directly to Decal Authority via Call, SMS, Viber, Messenger, or Email.">
    <link rel="preload" href="/assets/css/style.css" as="style">
    <link rel="stylesheet" href="/assets/css/style.css">
    <style>
        .copyable-item {
            cursor: pointer;
            color: var(--color-navy);
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: color 0.2s ease;
        }
        .copyable-item:hover {
            color: var(--color-mustard);
        }
        select.form-input {
            width: 100%;
            padding: 15px;
            border: 1px solid var(--color-border);
            background-color: var(--color-bg);
            color: var(--color-navy);
            font-size: 0.95rem;
            font-family: inherit;
            cursor: pointer;
        }
        select.form-input:focus {
            outline: none;
            border-color: var(--color-mustard);
        }

        /* --- MOBILE REORDERING --- */
        @media (max-width: 768px) {
            .contact-split-grid {
                display: flex !important;
                flex-direction: column !important;
            }
            /* Forces the Inquiry Builder to sit at the very top */
            .intake-builder {
                order: 1 !important;
                margin-top: 0 !important; 
            }
            /* Pushes the 01, 02, 03 contact methods underneath the form */
            .contact-methods {
                order: 2 !important;
                margin-top: 50px !important; /* Adds a clean gap between the form and the contacts */
            }
        }
    </style>
</head>
<body>
    
    <div id="global-nav"></div>

    <main class="content-full">
        <section class="page-header-section">
            <div class="header-container">
                <span class="hero-label">DIRECT CONVERSION CHANNELS</span>
                <h1>Talk to Decal Authority.</h1>
                <div class="accent-line"></div>
                <p>Direct access to decision makers. Reach our operations and procurement desk via Call, Messenger, Viber, or Email.</p>
            </div>
        </section>

        <section class="contact-intake-section">
            <div class="section-container contact-split-grid">
                
                <!-- LEFT: DIRECT CONTACT INFO -->
                <div class="contact-methods" id="json-contact-methods">
                    <!-- Contact blocks load here -->
                </div>

                <!-- RIGHT: SPECIFICATION INTAKE BUILDER -->
                <div class="intake-builder bg-light">
                    <h2 id="json-builder-title">Inquiry Builder</h2>
                    <p class="intake-subtext" id="json-builder-subtext">Structure your requirement below...</p>

                    <form id="intake-form" onsubmit="generateBrief(event)">
                        <div class="form-row">
                            <div class="form-group">
                                <label>Name *</label>
                                <input type="text" id="brief-name" required placeholder="Juan Dela Cruz">
                            </div>
                            <div class="form-group">
                                <label>Company (Optional)</label>
                                <input type="text" id="brief-company" placeholder="Leave blank if personal">
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label>Phone / Email *</label>
                                <input type="text" id="brief-contact" required placeholder="09XX-XXX-XXXX">
                            </div>
                            <div class="form-group">
                                <label>Dimensions / Size (Optional)</label>
                                <input type="text" id="brief-size" placeholder="e.g., 20x15 inches or Full Panel">
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label>Asset / Unit Count & Location</label>
                                <input type="text" id="brief-units" placeholder="e.g., 10x 6W Wing Vans — Bulacan">
                            </div>
                            <div class="form-group">
                                <label>Routing Destination</label>
                                <select id="brief-routing" class="form-input">
                                    <option value="primary">General Procurement</option>
                                    <option value="sanrafael">San Rafael Hub</option>
                                    <option value="bustos">Bustos HQ</option>
                                    <option value="malolos">Malolos Hub</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-group">
                            <label>Specification Status & Notes</label>
                            <textarea id="brief-notes" rows="3" placeholder="Tell us if you have an approved PDF spec, logo + truck photos, or need a consultation..."></textarea>
                        </div>

                        <button type="submit" class="btn btn-primary" style="width: 100%;">Prepare Specification Inquiry</button>
                    </form>

                    <div id="brief-output" style="display: none; margin-top: 25px;">
                        <textarea id="compiled-text" readonly rows="8" style="background-color: var(--color-bg); font-family: monospace; font-size: 0.85rem; width: 100%; padding: 15px; border: 1px solid var(--color-navy); margin-bottom: 15px;"></textarea>
                        <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                            <button type="button" onclick="sendToFacebook()" class="btn btn-secondary">Copy & Open Messenger</button>
                            <a id="email-brief-btn" href="#" target="_blank" rel="noopener noreferrer" class="btn btn-primary">Send via Gmail</a>
                        </div>
                    </div>
                </div>

            </div>
        </section>
    </main>

    <div id="global-footer"></div>
    <script src="/global.js"></script>

    <script>
        let hubData = {};
        let currentTargetEmail = "info@decalauthority.ph";
        let currentTargetMessenger = "DecalAuthority.official";

        const copySvg = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>`;

        fetch('/data/contacts.json')
            .then(response => response.json())
            .then(data => {
                const methodsContainer = document.getElementById('json-contact-methods');
                const call = data.contactInfo.call;
                const email = data.contactInfo.email;
                const social = data.contactInfo.social;
                hubData = data.hubs;

                let branchEmailsHtml = '';
                email.branches.forEach(e => {
                    branchEmailsHtml += `
                        <div style="margin-bottom: 12px; font-size: 0.95rem; display: flex; align-items: center;">
                            <span class="text-muted" style="display:inline-block; width: 85px;">${e.title}:</span> 
                            <span class="copyable-item" onclick="copyTextValue(this, '${e.address}')" title="Click to copy">
                                ${e.address} ${copySvg}
                            </span>
                            <span class="copy-feedback" style="display:none; color: var(--color-mustard); font-size: 0.75rem; font-weight:bold; margin-left:10px;">Copied!</span>
                        </div>
                    `;
                });

                methodsContainer.innerHTML = `
                    <div class="contact-block">
                        <span class="hero-label">${call.label}</span>
                        
                        <!-- Primary Phone -->
                        <div class="contact-primary" style="margin-top: 10px; font-size: 2rem;">
                            <span class="copyable-item" onclick="copyTextValue(this, '${call.primary}')" title="Click to copy">
                                ${call.primary} <span style="transform: scale(1.3); margin-left: 5px;">${copySvg}</span>
                            </span>
                            <span class="copy-feedback" style="display:none; color: var(--color-mustard); font-size: 1rem; font-weight:bold; margin-left:10px;">Copied!</span>
                        </div>

                        <!-- Secondary Landlines -->
                        <div class="contact-secondary" style="margin-top: 15px; margin-bottom: 25px;">
                            <span class="copyable-item" style="font-size: 0.95rem; color: var(--color-text-muted);" onclick="copyTextValue(this, '${call.secondary}')" title="Click to copy">
                                ${call.secondary} ${copySvg}
                            </span>
                            <span class="copy-feedback" style="display:none; color: var(--color-mustard); font-size: 0.75rem; font-weight:bold; margin-left:10px;">Copied!</span>
                        </div>
                    </div>

                    <div class="contact-block" style="margin-top: 60px;">
                        <span class="hero-label">${email.label}</span>
                        
                        <!-- Primary Email -->
                        <div class="contact-primary" style="margin-top: 10px; margin-bottom: 20px; font-size: 1.5rem;">
                            <span class="copyable-item" onclick="copyTextValue(this, '${email.primary}')" title="Click to copy">
                                ${email.primary} <span style="transform: scale(1.2); margin-left: 5px;">${copySvg}</span>
                            </span>
                            <span class="copy-feedback" style="display:none; color: var(--color-mustard); font-size: 0.85rem; font-weight:bold; margin-left:10px;">Copied!</span>
                        </div>
                        
                        <!-- Branch Emails -->
                        <div>
                            ${branchEmailsHtml}
                        </div>
                    </div>

                    <div class="contact-block" style="margin-top: 60px;">
                        <span class="hero-label">${social.label}</span>
                        
                        <!-- Facebook Page -->
                        <div class="contact-primary" style="margin-top: 10px; font-size: 1.5rem;">
                            ${social.name}
                        </div>
                        <div class="contact-secondary" style="margin-top: 5px; margin-bottom: 20px;">
                            <span class="copyable-item" style="font-size: 0.95rem; color: var(--color-text-muted);" onclick="copyTextValue(this, '${social.link}')" title="Click to copy">
                                ${social.displayLink} ${copySvg}
                            </span>
                            <span class="copy-feedback" style="display:none; color: var(--color-mustard); font-size: 0.75rem; font-weight:bold; margin-left:10px;">Copied!</span>
                        </div>
                        
                        <!-- FACEBOOK LINK -->
                        <div class="contact-actions" style="display: flex; align-items: center; flex-wrap: wrap; gap: 15px;">
                            <a href="${social.link}" target="_blank" rel="noopener noreferrer" class="contact-link">View Facebook Account &rarr;</a>
                        </div>
                    </div>
                `;

                document.getElementById('json-builder-title').innerText = data.builder.title;
                document.getElementById('json-builder-subtext').innerText = data.builder.subtext;
            })
            .catch(error => console.error('Error loading contacts data:', error));

        function generateBrief(e) {
            e.preventDefault();
            const name = document.getElementById('brief-name').value;
            const company = document.getElementById('brief-company').value || 'Personal / None';
            const contact = document.getElementById('brief-contact').value;
            const size = document.getElementById('brief-size').value || 'To be confirmed';
            const units = document.getElementById('brief-units').value || 'To be confirmed';
            const notes = document.getElementById('brief-notes').value || 'None specified';
            const routing = document.getElementById('brief-routing').value;

            currentTargetEmail = hubData[routing].email;
            currentTargetMessenger = hubData[routing].messenger;

            const compiledText = `DECAL AUTHORITY — INQUIRY
-------------------------
Name: ${name}
Company: ${company}
Contact: ${contact}
Dimensions: ${size}
Assets: ${units}
Notes: ${notes}`;
            
            document.getElementById('compiled-text').value = compiledText;
            document.getElementById('brief-output').style.display = 'block';

            const gmailUrl = `https://mail.google.com/mail/?view=cm&fs=1&to=${currentTargetEmail}&su=Project+Inquiry+—+${encodeURIComponent(name)}&body=${encodeURIComponent(compiledText)}`;
            document.getElementById('email-brief-btn').href = gmailUrl;
        }

        function sendToFacebook() {
            const copyText = document.getElementById('compiled-text');
            copyText.select();
            document.execCommand("copy");
            window.open("https://m.me/DecalAuthority.official", "_blank");
        }

        function copyTextValue(element, textToCopy) {
            navigator.clipboard.writeText(textToCopy);
            const feedback = element.nextElementSibling;
            feedback.style.display = 'inline';
            setTimeout(() => { feedback.style.display = 'none'; }, 1500);
        }
    </script>
</body>
</html>
